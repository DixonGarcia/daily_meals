<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyMeals — Copiloto Gemini (Variante 2: Modal Pantalla Completa)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: rgba(20, 20, 20, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .modal-workspace {
      background: #ffffff;
      border-radius: 20px;
      max-width: 860px;
      width: 100%;
      display: grid;
      grid-template-columns: 260px 1fr;
      overflow: hidden;
      border: 1px solid #e9e9e9;
    }
    @media (max-width: 720px) {
      .modal-workspace { grid-template-columns: 1fr; }
    }
    .left-drawer {
      background: #f8f9fa;
      border-right: 1px solid #e9e9e9;
      padding: 1.25rem;
    }
    .right-chat {
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="modal-workspace">
    <div class="left-drawer">
      <h3 style="font-family:'Outfit';margin-bottom:0.75rem;">Historial</h3>
      <p style="font-size:0.85rem;color:#767676;">Sesión activa: Plan Semanal</p>
    </div>
    <div class="right-chat">
      <h2 style="font-family:'Outfit';margin-bottom:0.75rem;">Asistente Gemini (Modal)</h2>
      <p style="font-size:0.9rem;color:#343434;">Conversa en ventana flotante separada del calendario.</p>
    </div>
  </div>
</body>
</html>
