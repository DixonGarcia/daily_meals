<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEAT-05 Variación 1: Híbrido Inline (Chat + Formulario Mágico)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8f9fa; padding: 1.25rem; color: #343434; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 980px; margin: 0 auto; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #e9e9e9; border-radius: 16px; padding: 1.35rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h3 { font-family: 'Outfit', sans-serif; margin-bottom: 0.75rem; color: #141414; }
    .new-dish-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 0.85rem; margin-bottom: 0.85rem; }
    .ing-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.35rem 0; border-bottom: 1px dashed #dcfce7; font-size: 0.82rem; }
    .qty-input { width: 85px; padding: 0.25rem 0.45rem; border: 1px solid #bbf7d0; border-radius: 6px; font-size: 0.8rem; }
    .btn-primary { width: 100%; background: #9bc024; color: #141414; border: none; border-radius: 10px; padding: 0.75rem; font-family: 'Outfit', sans-serif; font-weight: 800; cursor: pointer; }
    .btn-ai { background: #0094e4; color: #fff; border: none; border-radius: 10px; padding: 0.6rem 0.9rem; font-family: 'Outfit', sans-serif; font-weight: 800; cursor: pointer; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <h3>1. En el Chat del Calendario (/)</h3>
      <div class="new-dish-box">
        <div style="font-weight:800;color:#166534;margin-bottom:0.4rem;">🆕 Plato Nuevo: Pollo al curry (Almuerzo)</div>
        <div class="ing-row">
          <label><input type="checkbox" checked> Pechuga de pollo <small>(Carnicería)</small></label>
          <input type="text" class="qty-input" value="500g">
        </div>
        <div class="ing-row">
          <label><input type="checkbox" checked> Leche de coco <small>(Víveres)</small></label>
          <input type="text" class="qty-input" value="1 lata">
        </div>
        <div class="ing-row">
          <label><input type="checkbox"> Cilantro fresco <small>(Verdulería)</small></label>
          <input type="text" class="qty-input" value="1 manojo">
        </div>
      </div>
      <button class="btn-primary">📥 Guardar Plato y Cargar Menú</button>
    </div>

    <div class="card">
      <h3>2. En Nuevo Plato (/dishes/new)</h3>
      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
        <input type="text" value="Lasaña boloñesa" style="flex:1;padding:0.6rem;border:1px solid #e9e9e9;border-radius:8px;">
        <button class="btn-ai">✨ Autocompletar con IA</button>
      </div>
      <p style="font-size:0.82rem;color:#767676;">Rellena categoría e ingredientes (existentes y nuevos) con un toque.</p>
    </div>
  </div>
</body>
</html>
