<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyMeals — Acceso Privado (Variante 2: Panel Dividido Hero)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #9bc024;
      --color-secondary: #141414;
      --color-body: #ffffff;
      --color-body-alt: #f8f9fa;
      --color-border: #e9e9e9;
      --color-title: #111111;
      --color-text: #343434;
      --color-subtitle: #767676;
      --blue-high: #0094e4;
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-body-alt);
      color: var(--color-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .split-container {
      background: var(--color-body);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      max-width: 820px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 720px) {
      .split-container { grid-template-columns: 1fr; }
    }
    .hero-side {
      background: #141414;
      color: #ffffff;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .form-side {
      padding: 2.5rem;
    }
    .form-input {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 0.85rem;
      margin: 0.6rem 0 1.2rem;
    }
    .btn-submit {
      width: 100%;
      background: var(--blue-high);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="split-container">
    <div class="hero-side">
      <div>
        <h2 style="font-family:'Outfit';font-size:1.6rem;">🍳 DailyMeals</h2>
        <p style="margin-top:0.75rem;color:#d4d4d4;font-size:0.9rem;">Planificación semanal de almuerzos, cenas y lista de compras inteligente.</p>
      </div>
      <div style="font-size:0.8rem;color:#9bc024;">Protección activa de servidor personal</div>
    </div>
    <div class="form-side">
      <h1 style="font-family:'Outfit';font-size:1.5rem;margin-bottom:0.5rem;">Iniciar Sesión</h1>
      <p style="font-size:0.85rem;color:#767676;margin-bottom:1rem;">Introduce la clave maestra configurada en el servidor.</p>
      <form>
        <label style="font-size:0.75rem;font-weight:700;text-transform:uppercase;">Clave de Acceso</label>
        <input type="password" class="form-input" placeholder="••••••••••••">
        <button type="submit" class="btn-submit">Continuar</button>
      </form>
    </div>
  </div>
</body>
</html>
